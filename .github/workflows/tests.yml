name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest
      - name: Reconstruct published evidence archives
        run: |
          python experiments/reconstruct_gate3_raw.py
          python experiments/reconstruct_gate4_raw.py
          python experiments/reconstruct_gate4r_raw.py
      - name: Verify evidence manifests
        run: python experiments/verify_manifests.py
